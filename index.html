<!DOCTYPE html><html lang="id"><head>    <meta charset="UTF-8" />    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />    <title>TileTether - AAA Login & Loading</title>    <!-- Import Google Fonts khusus Game -->    <link rel="preconnect" href="https://fonts.googleapis.com">    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">    <style>        :root {            --gold: #ffd700;             --gold-glow: #ffae00;            --green: #00ff66;             --green-dark: #008a37;            --blue-glow: #00d2ff;            --red: #ff3366;            --font-game: 'Press Start 2P', monospace;            --font-ui: 'Orbitron', sans-serif;        }        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }                body {            width: 100vw; height: 100vh; overflow: hidden;            background-color: #030308;             font-family: var(--font-ui);             color: #fff;        }                /* Background & Animated Overlay */        #bg-container {            position: fixed; inset: 0; z-index: 1;            background-image:                radial-gradient(circle at 50% 20%, rgba(255, 174, 0, 0.15) 0%, transparent 40%),                radial-gradient(circle at 80% 80%, rgba(0, 255, 102, 0.1) 0%, transparent 40%),                linear-gradient(180deg, #070914 0%, #0d1527 50%, #050a12 100%);            transition: opacity 0.8s ease-in-out;        }        #bg-container::before {            content: ''; position: absolute; inset: 0;            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent), url('paths/path_01.png');            background-size: cover; background-position: center; filter: blur(2px) contrast(1.2); opacity: 0.3; pointer-events: none;        }        /* Grid Effect Ala Game Cyber */        #bg-container::after {            content: ''; position: absolute; inset: 0;            background: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);            background-size: 30px 30px;            pointer-events: none;        }        #auth-wrapper {            position: absolute; inset: 0; display: flex; flex-direction: column;            align-items: center; justify-content: center; padding: 16px; z-index: 10;        }                /* Gaming HUD Style Window */        .popup-box {            width: 100%; max-width: 440px; padding: 28px 24px;            background: rgba(10, 14, 26, 0.88);            backdrop-filter: blur(16px);            -webkit-backdrop-filter: blur(16px);            border: 2px solid var(--gold);            /* Corner Cut Out Effect (Sudut Terpotong Khas Gaming) */            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25), inset 0 0 15px rgba(255, 215, 0, 0.1);            display: flex; flex-direction: column; gap: 14px;             position: relative; max-height: 95vh; overflow-y: auto;            animation: gamerPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;        }        .popup-title {            font-family: var(--font-game);            font-size: 14px; color: var(--gold);            text-align: center; border-bottom: 2px dashed rgba(255, 215, 0, 0.4);             padding-bottom: 12px; margin-bottom: 6px;            text-shadow: 3px 3px 0px #000, 0 0 10px rgba(255, 215, 0, 0.8);            letter-spacing: 1px;            line-height: 1.6;        }        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }                .form-group label {             font-family: var(--font-game);            font-size: 9px; color: var(--gold);             text-shadow: 1px 1px 0 #000;            letter-spacing: 1px;        }                .form-control {             background: rgba(0, 0, 0, 0.7);             border: 2px solid rgba(255, 215, 0, 0.3);             padding: 12px 14px; color: #fff;             font-family: var(--font-ui); font-size: 13px; font-weight: 600;            outline: none; transition: all 0.2s ease;            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);        }                .form-control::placeholder { color: rgba(255,255,255,0.3); font-family: var(--font-ui); }                .form-control:focus {             border-color: var(--gold);             box-shadow: 0 0 12px var(--gold-glow);            background: rgba(10, 20, 35, 0.9);        }        .avatar-section {             display: none; flex-direction: column; gap: 8px; text-align: center;             background: rgba(0,0,0,0.5); padding: 10px;             border: 1px solid rgba(255, 215, 0, 0.3);         }                .avatar-section label {             font-family: var(--font-game);             font-size: 9px; color: var(--gold);         }                .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }                .avatar-item {             width: 100%; aspect-ratio: 1; background: #000;             border: 2px solid #333;             cursor: pointer; transition: all 0.2s;         }        .avatar-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }                .avatar-item:hover img { opacity: 1; }                .avatar-item.selected {             border-color: var(--gold);             box-shadow: 0 0 12px var(--gold-glow);             transform: scale(1.08);         }        .avatar-item.selected img { opacity: 1; }        /* Press Start 2P Gaming Buttons */        .btn {            font-family: var(--font-game);            font-size: 11px;            color: #fff;            text-transform: uppercase;            cursor: pointer;             padding: 14px; width: 100%;            border: 2px solid var(--gold);            background: linear-gradient(180deg, #1e5799 0%, #002244 100%);            box-shadow: 0 5px 0 #000, 0 0 15px rgba(0, 210, 255, 0.4);             text-shadow: 2px 2px 0 #000;            transition: all 0.1s ease;            position: relative;            margin-top: 5px;        }        .btn:hover {            filter: brightness(1.2);            box-shadow: 0 5px 0 #000, 0 0 20px rgba(0, 255, 102, 0.6);        }        .btn:active {             transform: translateY(4px);             box-shadow: 0 1px 0 #000, 0 0 10px rgba(0, 255, 102, 0.8);         }                .btn-green {             border-color: var(--green);            background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);            color: #000;            text-shadow: none;            font-weight: 900;        }        /* Loader Styles Gaming HUD */        #loader-wrapper {            position: relative; z-index: 10; width: 100%; height: 100%; display: none; flex-direction: column;            align-items: center; justify-content: center; gap: 25px;             transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);        }                .logo-container {            width: 400px; max-width: 85vw; aspect-ratio: 6 / 1;            background-image: url('logo.png'); background-size: contain; background-repeat: no-repeat; background-position: center;            animation: gamerPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, float 3s ease-in-out infinite 0.8s;            filter: drop-shadow(0px 0px 15px rgba(255,215,0,0.6));        }                .progress-container {            width: 320px; max-width: 80vw; height: 16px;             background-color: rgba(0, 0, 0, 0.8);            border: 2px solid var(--gold);            padding: 2px;            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);             position: relative; animation: fadeIn 1s ease 0.5s both;        }                .progress-bar {            width: 0%; height: 100%;             background: linear-gradient(90deg, var(--gold-glow), var(--green), var(--gold-glow));            background-size: 200% 100%;            animation: shimmer 1s linear infinite;            box-shadow: 0 0 10px var(--green);        }                .loading-info {            display: flex; justify-content: space-between; width: 320px; max-width: 80vw;            color: var(--gold); font-family: var(--font-game); font-size: 9px;            text-shadow: 2px 2px 0 #000; animation: fadeIn 1s ease 0.5s both;        }        /* Animations */        @keyframes gamerPopIn { 0% { opacity: 0; transform: scale(0.8) translateY(-30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }        @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }                .fade-out { opacity: 0 !important; transform: scale(1.05); pointer-events: none; }        .fade-in { display: block !important; opacity: 1 !important; }                #game-frame {            position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 5;            opacity: 0; transition: opacity 1s ease-in; display: none;        }                /* Pixel Scrollbar */        ::-webkit-scrollbar { width: 8px; }        ::-webkit-scrollbar-track { background: #000; }        ::-webkit-scrollbar-thumb { background: var(--gold); border: 1px solid #000; }                .toggle-link {            font-family: var(--font-game);            color: var(--gold); font-size: 8px; text-decoration: none;             line-height: 1.5; transition: all 0.2s;            display: inline-block;        }        .toggle-link:hover { color: var(--green); text-shadow: 0 0 8px var(--green); }        /* --- SPLASH SCREEN STYLES --- */        #splash-screen {            position: fixed;             inset: 0;             z-index: 9999; /* Z-index tertinggi agar menutupi semuanya */            background-color: #030308;            background-image: url('splash.png'); /* Memanggil gambar splash.png */            background-size: cover;             background-position: center;            background-repeat: no-repeat;            display: flex;             align-items: center;             justify-content: center;            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;        }        /* Menyembunyikan splash screen saat sudah selesai */        #splash-screen.hidden {            opacity: 0;            visibility: hidden;            pointer-events: none;        }        /* Animasi Partikel */        .splash-particle {            position: absolute;            bottom: -10px;            border-radius: 50%;            background: var(--gold); /* Menggunakan variabel warna yang sudah ada */            box-shadow: 0 0 10px var(--gold-glow);            pointer-events: none;            opacity: 0;            animation: floatUp linear infinite;        }        @keyframes floatUp {            0% { transform: translateY(0) scale(0.5); opacity: 0; }            20% { opacity: 0.8; }            80% { opacity: 0.6; }            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }        }    </style></head><body>    <!-- Splash Screen Container -->    <div id="splash-screen"></div>    <div id="bg-container"></div>    <div id="auth-wrapper">        <div class="popup-box">            <div class="popup-title" id="authTitle">LOGIN AKUN</div>            <form id="authForm" onsubmit="handleAuthSubmit(event)">                <div class="form-group" id="usernameGroup" style="display:none;">                    <label>Username</label>                    <input type="text" id="authUsername" class="form-control" placeholder="Player_Name">                </div>                <div class="avatar-section" id="avatarGroup">                    <label>Pilih Avatar Anda</label>                    <div class="avatar-grid" id="registerAvatarGrid"></div>                </div>                <div class="form-group">                    <label>Email</label>                    <input type="email" id="authEmail" class="form-control" required placeholder="player@game.com">                </div>                <div class="form-group" id="ageGroup" style="display:none;">                    <label>Umur (10 - 79)</label>                    <input type="number" id="authAge" class="form-control" min="10" max="79" placeholder="18">                </div>                <div class="form-group">                    <label>Password</label>                    <input type="password" id="authPassword" class="form-control" required placeholder="••••••••">                </div>                <button type="submit" class="btn btn-green" id="authSubmitBtn">MASUK</button>            </form>            <div style="text-align:center; margin-top:8px;">                <a href="#" class="toggle-link" id="toggleAuthModeBtn" onclick="toggleAuthMode(); return false;">&gt; Belum punya akun? Daftar</a>            </div>            <div id="authErrorMsg" style="color: var(--red); font-family: var(--font-game); font-size: 8px; text-align: center; margin-top: 5px; min-height: 16px;"></div>        </div>    </div>    <div id="loader-wrapper">        <div class="logo-container"></div>        <div class="loading-wrapper">            <div class="loading-info">                <span id="loading-text">LOADING...</span>                <span id="loading-percent">0%</span>            </div>            <div class="progress-container" style="margin-top: 8px;">                <div class="progress-bar" id="progress-bar"></div>            </div>        </div>    </div>        <iframe id="game-frame" src=""></iframe>        <script type="module">        // --- LOGIKA SPLASH SCREEN & PARTIKEL ---        const splashScreen = document.getElementById('splash-screen');        const particleCount = 40; // Jumlah partikel yang meramaikan layar        // Membuat partikel berterbangan        for (let i = 0; i < particleCount; i++) {            let particle = document.createElement('div');            particle.classList.add('splash-particle');                        // Randomisasi ukuran, posisi, dan durasi animasi            let size = Math.random() * 4 + 2; // Ukuran 2px hingga 6px            particle.style.width = `${size}px`;            particle.style.height = `${size}px`;            particle.style.left = `${Math.random() * 100}vw`; // Posisi horizontal acak                        // Variasi kecepatan dan penundaan (delay)            particle.style.animationDuration = `${Math.random() * 3 + 2}s`; // 2s hingga 5s            particle.style.animationDelay = `${Math.random() * 3}s`;                        // Sesekali gunakan warna hijau/biru agar lebih berwarna            if (Math.random() > 0.7) {                particle.style.background = 'var(--green)';                particle.style.boxShadow = '0 0 10px var(--green-dark)';            } else if (Math.random() > 0.85) {                particle.style.background = 'var(--blue-glow)';                particle.style.boxShadow = '0 0 10px #0055ff';            }            splashScreen.appendChild(particle);        }        // Menghilangkan Splash Screen setelah semua halaman & asset dasar dimuat        window.addEventListener('load', () => {            // Memberikan jeda (delay) ekstra selama 2.5 detik agar pemain bisa menikmati animasi splash            setTimeout(() => {                splashScreen.classList.add('hidden');                                // Opsional: hapus partikel dari DOM setelah transisi selesai untuk menghemat memori                setTimeout(() => {                    splashScreen.innerHTML = '';                 }, 1000);             }, 2500);         });        // ----------------------------------------        const firebaseConfig = {            apiKey: "AIzaSyB-lRvFDWFceXE1lloWeAP732uohRe7iLo",            authDomain: "ambademo.firebaseapp.com",            projectId: "ambademo",            storageBucket: "ambademo.firebasestorage.app",            messagingSenderId: "346919760984",            appId: "1:346919760984:web:c9b102656aa020f3f2062d"        };        let auth, db;        let authMode = 'login';        let appLoaded = false;        let selectedRegisterAvatar = 'avatar/avatar_01.png';        const loadingDuration = 3000;        function initRegisterAvatars() {            const grid = document.getElementById('registerAvatarGrid');            grid.innerHTML = '';            for(let i=1; i<=12; i++) {                let fileName = `avatar/avatar_${i.toString().padStart(2, '0')}.png`;                let div = document.createElement('div');                div.className = 'avatar-item';                if(i === 1) div.classList.add('selected');                div.innerHTML = `<img src="${fileName}" onerror="this.src='characters/bob/idle_1.png'">`;                                div.onclick = () => {                    document.querySelectorAll('#registerAvatarGrid .avatar-item').forEach(el => el.classList.remove('selected'));                    div.classList.add('selected');                    selectedRegisterAvatar = fileName;                };                grid.appendChild(div);            }        }        initRegisterAvatars();        try {            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");            const { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");            const { getFirestore, doc, setDoc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");                        const app = initializeApp(firebaseConfig);            auth = getAuth(app);            db = getFirestore(app);            window.signOutMethod = signOut;            onAuthStateChanged(auth, async (user) => {                if (user && !appLoaded) {                    appLoaded = true;                    if (!window.isRegistering) {                        try {                            await updateDoc(doc(db, "users", user.uid), { isOnline: true });                        } catch (e) { console.log(e); }                    }                    startLoadingSequence();                }            });            window.registerUserFB = async (email, password, username, age, avatarUrl) => {                window.isRegistering = true;                const res = await createUserWithEmailAndPassword(auth, email, password);                const initialData = {                    uid: res.user.uid,                    username: username,                    email: email,                    age: parseInt(age),                    profilePic: avatarUrl,                    coins: 100, wins: 0, losses: 0,                    items: { antidead: 0, stalestill: 0, glidesteps: 0 },                    isOnline: true, friends: [], friendRequests: []                };                await setDoc(doc(db, "users", res.user.uid), initialData);                window.isRegistering = false;            };            window.loginUserFB = async (email, password) => {                await signInWithEmailAndPassword(auth, email, password);            };        } catch(err) {            document.getElementById('authErrorMsg').innerText = "Koneksi Firebase gagal. Periksa koneksi internet Anda.";        }        window.toggleAuthMode = function() {            authMode = authMode === 'login' ? 'register' : 'login';            document.getElementById('authForm').reset();                        document.getElementById('authTitle').innerText = authMode === 'login' ? 'LOGIN AKUN' : 'DAFTAR AKUN BARU';            document.getElementById('usernameGroup').style.display = authMode === 'login' ? 'none' : 'flex';            document.getElementById('ageGroup').style.display = authMode === 'login' ? 'none' : 'flex';            document.getElementById('avatarGroup').style.display = authMode === 'login' ? 'none' : 'flex';            document.getElementById('authSubmitBtn').innerText = authMode === 'login' ? 'MASUK' : 'DAFTAR SEKARANG';            document.getElementById('toggleAuthModeBtn').innerText = authMode === 'login' ? '> Belum punya akun? Daftar' : '> Sudah punya akun? Login';            document.getElementById('authErrorMsg').innerText = "";        };        window.handleAuthSubmit = async function(e) {            e.preventDefault();            document.getElementById('authErrorMsg').innerText = "";            const email = document.getElementById('authEmail').value;            const password = document.getElementById('authPassword').value;            const username = document.getElementById('authUsername').value;            const age = parseInt(document.getElementById('authAge').value);            const btn = document.getElementById('authSubmitBtn');            if (authMode === 'register' && (!username || isNaN(age) || age < 10 || age > 79)) {                document.getElementById('authErrorMsg').innerText = "Isi username & umur (10-79) dengan benar.";                return;            }            btn.disabled = true;            btn.innerText = "LOADING...";            try {                if (authMode === 'register') {                    await window.registerUserFB(email, password, username, age, selectedRegisterAvatar);                } else {                    await window.loginUserFB(email, password);                }            } catch (err) {                document.getElementById('authErrorMsg').innerText = err.message;                btn.disabled = false;                btn.innerText = authMode === 'login' ? 'MASUK' : 'DAFTAR SEKARANG';            }        };        function startLoadingSequence() {            document.getElementById('auth-wrapper').style.display = 'none';            const loaderWrapper = document.getElementById('loader-wrapper');            const bgContainer = document.getElementById('bg-container');            const iframe = document.getElementById('game-frame');                        loaderWrapper.classList.remove('fade-out');            loaderWrapper.style.display = 'flex';            loaderWrapper.style.opacity = '1';            bgContainer.style.display = 'block';            bgContainer.style.opacity = '1';                        iframe.src = "mainmenu.html";                        const progressBar = document.getElementById('progress-bar');            const percentText = document.getElementById('loading-percent');            const statusText = document.getElementById('loading-text');                        const statusMessages = [                "INIT ENGINE...",                "LOADING MAPS...",                "COMPILING SHADERS...",                "SYNCING DATA...",                "OPTIMIZING RENDER...",                "GAME READY!"            ];                        let startTime = null;                        function updateProgress(currentTime) {                if (!startTime) startTime = currentTime;                const elapsed = currentTime - startTime;                                let t = Math.min(elapsed / loadingDuration, 1);                let easeOutProgress = 1 - Math.pow(1 - t, 3);                let progress = Math.min(easeOutProgress * 100, 100);                                progressBar.style.width = `${progress}%`;                percentText.innerText = `${Math.floor(progress)}%`;                                const messageIndex = Math.min(                    Math.floor((progress / 100) * statusMessages.length),                    statusMessages.length - 1                );                statusText.innerText = statusMessages[messageIndex];                                if (progress < 100) {                    requestAnimationFrame(updateProgress);                } else {                    setTimeout(() => {                        loaderWrapper.classList.add('fade-out');                        bgContainer.style.opacity = '0';                        iframe.classList.add('fade-in');                        setTimeout(() => {                            loaderWrapper.style.display = 'none';                            bgContainer.style.display = 'none';                        }, 1000);                    }, 300);                }            }            requestAnimationFrame(updateProgress);        }        window.addEventListener('message', async (event) => {            if (event.data === 'DO_LOGOUT') {                if (auth && auth.currentUser) {                    const { updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");                    try {                        await updateDoc(doc(db, "users", auth.currentUser.uid), { isOnline: false });                    } catch (e) { console.error(e); }                    if (window.signOutMethod) { await window.signOutMethod(auth); }                }                appLoaded = false;                const iframe = document.getElementById('game-frame');                iframe.src = '';                iframe.classList.remove('fade-in');                document.getElementById('bg-container').style.display = 'block';                document.getElementById('bg-container').style.opacity = '1';                document.getElementById('auth-wrapper').style.display = 'flex';                const btn = document.getElementById('authSubmitBtn');                btn.disabled = false;                btn.innerText = authMode === 'login' ? 'MASUK' : 'DAFTAR SEKARANG';            }        });    </script></body></html>
